<!DOCTYPE html>
<html lang="bg">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AKS Price Checker</title>
        <link rel="stylesheet" href="/static/assets/css/style.css">
    </head>
    <body>
        <div class="wrap">
            <header>
                <h1>AKS <span>Price Checker</span></h1>
                <div class="sub">търсене при партньори — паралелно, всички сайтове наведнъж</div>
            </header>

            <div class="searchbar">
                <input type="text" id="q" placeholder="Модел или част — напр. iPhone 13 дисплей" autofocus>
                <div class="seg" role="group" aria-label="Категория">
                    <button id="btnPhone" class="active">Телефони</button>
                    <button id="btnPc">Компютри</button>
                </div>
                <button class="go" id="go">Търси</button>
                <button class="cp-btn" id="cpBtn" title="CellPhone BG — вход за търговци">
                    <span class="cp-dot" id="cpDot"></span>CP BG
                </button>
            </div>

            <div class="cp-modal" id="cpModal" hidden>
                <div class="cp-box">
                    <h3>CellPhone BG — вход за търговци</h3>
                    <input type="email" id="cpEmail" placeholder="E-mail" autocomplete="username">
                    <input type="password" id="cpPass" placeholder="Парола" autocomplete="current-password">
                    <div class="cp-actions">
                        <button id="cpLogout" class="cp-secondary" hidden>Изход</button>
                        <button id="cpCancel" class="cp-secondary">Отказ</button>
                        <button id="cpSubmit" class="cp-primary">Вход</button>
                    </div>
                    <div class="cp-msg" id="cpMsg"></div>
                </div>
            </div>

            <div class="status" id="status"></div>
            <div id="results"></div>
            <div class="hint" id="hint">Въведи модел и натисни „Търси“ — резултатите от всички сайтове идват заедно за няколко секунди.</div>
        </div>

        <script src="/static/assets/js/app.js"></script>
    </body>
</html>
